<!DOCTYPE html>
<html>
<head>
    <title>Face Attendance System</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container p-4">

<h2 class="mb-3">Attendance for {{ datetoday2 }}</h2>
<span class="badge bg-primary mb-3">Total Registered Users: {{ totalreg }}</span>

{% if mess %}
<div class="alert alert-{{ 'success' if mtype=='success' else 'warning' if mtype=='warning' else 'info' }}">
    {{ mess }}
</div>
{% endif %}

<table class="table table-bordered">
    <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Time</th>
        </tr>
    </thead>
    <tbody>
        {% for i in range(l) %}
        <tr>
            <td>{{ names[i] }}</td>
            <td>{{ rolls[i] }}</td>
            <td>{{ times[i] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<form class="row g-2 mb-3" action="/add" method="post">
    <div class="col">
        <input class="form-control" type="text" name="newusername" placeholder="Name" required>
    </div>
    <div class="col">
        <input class="form-control" type="text" name="newuserid" placeholder="Roll" required>
    </div>
    <div class="col-auto">
        <button class="btn btn-success">Add New User</button>
    </div>
</form>

<form action="/start" method="get">
    <button class="btn btn-primary">Take Attendance</button>
</form>

</body>
</html>
